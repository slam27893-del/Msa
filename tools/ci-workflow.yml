name: Build & Test

# يبني الـ APK ويشغّل اختبارات الوحدات في كل دفعة (push) لأي فرع.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Build prototype (APK) & run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Build debug APK & run unit tests
        uses: gradle/actions/setup-gradle@v4
        with:
          arguments: assembleDebug test

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

      - name: Publish prototype release (installable APK)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete prototype --cleanup-tag -y || true
          gh release create prototype app/build/outputs/apk/debug/app-debug.apk \
            --title "Prototype — المساعد الدراسي الذكي" \
            --notes "نسخة تجريبية (debug APK) مبنية تلقائيًا من أحدث كود في الفرع." \
            --prerelease \
            --target "$GITHUB_SHA"
