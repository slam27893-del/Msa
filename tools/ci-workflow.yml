name: Build & Test

# يبني الـ APK ويشغّل اختبارات الوحدات في كل دفعة (push) لأي فرع.
# ملاحظة: كل منطق البناء داخل tools/ci.sh — تعديله لا يتطلب تعديل هذا الملف.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build prototype (APK) & run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test & publish prototype release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci.sh

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: warn
